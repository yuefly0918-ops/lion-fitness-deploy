<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f9b8e">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>赖恩健身器材 · 产品展示</title>
<link rel="icon" type="image/png" href="assets/img/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="bar-inner">
    <a class="brand" href="#top">
      <img class="brand-logo" src="assets/img/logo.png" alt="赖恩健身器材">
      <span class="brand-mark">赖恩</span>
      <span class="brand-name">健身器材</span>
    </a>
    <nav class="nav" id="nav">
      <button class="nav-btn active" data-cat="pilates-machine">普拉提器械</button>
      <button class="nav-btn" data-cat="foreign">外贸款器械</button>
      <button class="nav-btn" data-cat="pilates-accessory">普拉提配件</button>
      <button class="nav-btn" data-cat="shaping">塑形器械</button>
      <button class="nav-btn" data-cat="strength">力量器械配件</button>
      <button class="nav-btn nav-contact" data-scroll="contact">联系我们</button>
    </nav>
    <div class="search">
      <input id="searchInput" type="search" placeholder="搜索产品名称 / 规格 / 系列…" autocomplete="off">
      <span class="search-ico">⌕</span>
    </div>
  </div>
</header>

<section class="hero" id="top">
  <div class="hero-inner">
    <h1>赖恩健身器材<span>· 产品目录</span></h1>
    <p class="tagline">专注普拉提整机与配件 · 枫木 / 橡木 / 榉木 / 铝合金四大材质 · 支持贴牌定制</p>
    <div class="stats" id="stats"></div>
  </div>
</section>

<main class="wrap" id="main"></main>

<div class="modal" id="modal" hidden>
  <div class="modal-mask" data-close></div>
  <article class="modal-card" id="modalCard"></article>
</div>

<footer class="footer" id="contact">
  <div class="contact-inner">
    <div class="contact-col contact-brand">
      <div class="contact-brand-row">
        <img class="brand-logo brand-logo-lg" src="assets/img/logo.png" alt="赖恩健身器材">
        <span class="brand-mark">赖恩</span>
        <span class="brand-name">健身器材</span>
      </div>
      <p class="contact-tagline">专注普拉提整机与配件 · 枫木 / 橡木 / 榉木 / 铝合金四大材质 · 支持贴牌定制</p>
      <div class="contact-badges">
        <span class="cb">贴牌 LOGO</span>
        <span class="cb">材质升级</span>
        <span class="cb">颜色定制</span>
      </div>
    </div>
    <div class="contact-col">
      <h4 class="contact-h">联系方式</h4>
      <ul class="contact-list" id="contactList"></ul>
    </div>
    <div class="contact-col">
      <h4 class="contact-h">到访与咨询</h4>
      <div class="contact-addr" id="contactAddr"></div>
      <div class="contact-social" id="contactSocial"></div>
    </div>
  </div>
  <div class="foot-bottom">
    <span>© <span id="footYear"></span> 赖恩健身器材 · 产品规格以实物为准</span>
    <span class="foot-note">本目录资料整理自 2026 产品图册</span>
  </div>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
